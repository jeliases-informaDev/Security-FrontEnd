name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  construir:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8081/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tipos y compilación. No se corre eslint aquí: hoy tiene errores previos del repo.
      - run: npx tsc --noEmit
      - run: npx next build
